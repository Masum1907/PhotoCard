<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal Card &amp; Banner Maker</title>
<style>
:root{--bg:#f2f4f9;--panel:#fff;--text:#1b2033;--muted:#667;--line:#dde0ea;--accent:#2f5bea}
@media(prefers-color-scheme:dark){:root{--bg:#11131b;--panel:#1b1e2a;--text:#eef0f7;--muted:#9aa0b4;--line:#2d3142;--accent:#7aa2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI','Noto Sans Bengali','Kalpurush','Nirmala UI',sans-serif}
header{padding:18px 24px 0}
h1{margin:0;font-size:1.35rem}
header p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
main{display:grid;grid-template-columns:minmax(310px,430px) 1fr;gap:20px;padding:18px 24px 30px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}.stage{order:-1;position:static!important}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 12px;padding:6px 12px 12px}
legend{font-weight:700;font-size:.82rem;padding:0 6px;color:var(--accent)}
label{display:block;font-size:.8rem;color:var(--muted);margin:8px 0 3px}
input[type=text],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:.92rem}
textarea{resize:vertical;min-height:58px}
input[type=file]{width:100%;font-size:.8rem;margin-top:6px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{width:auto;padding:8px 14px;border-radius:999px;background:var(--bg);color:var(--text);border:1px solid var(--line);font-weight:600;font-size:.85rem}
.chip:hover{border-color:var(--accent);color:var(--accent);opacity:1}
button{border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer;padding:12px;width:100%}
button:hover{opacity:.9}
.person{border:1px dashed var(--line);border-radius:10px;padding:8px 10px 10px;margin-bottom:10px}
.ph{display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
.x{width:auto;padding:2px 9px;background:transparent;color:#d33;border:1px solid var(--line);font-size:.8rem}
.person input[type=text]{margin-top:6px}
#add{background:var(--bg);color:var(--accent);border:1px dashed var(--accent)}
.stage{position:sticky;top:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
canvas{width:100%;max-height:82vh;object-fit:contain;border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.28);background:#222}
.stage button{max-width:520px}
</style>
</head>
<body>
<header>
  <h1>✨ Universal Card &amp; Banner Maker</h1>
  <p>Congratulation, Seminar, Event, Achievement — jekono dhoroner card/banner. 0 theke 4 jon porjonto manush. List/deadline poster-o hoy.</p>
</header>
<main>
<section class="panel">
  <fieldset><legend>Quick Template</legend>
    <div class="chips" id="presets">
      <button class="chip" data-p="congrats">🎓 Congratulation</button>
      <button class="chip" data-p="teacher">👩‍🏫 Teacher</button>
      <button class="chip" data-p="seminar">🎤 Seminar</button>
      <button class="chip" data-p="event">🎉 Event</button>
      <button class="chip" data-p="achieve">🏆 Achievement</button>
      <button class="chip" data-p="conflist">📚 Conference List</button>
      <button class="chip" data-p="higher">🌍 Higher Study</button>
      <button class="chip" data-p="job">💼 Job / Internship</button>
      <button class="chip" data-p="result">🏅 Dean's / Result</button>
      <button class="chip" data-p="workshop">🛠 Workshop</button>
      <button class="chip" data-p="recruit">📢 Club Recruitment</button>
      <button class="chip" data-p="welcome">👋 Welcome / Farewell</button>
    </div>
  </fieldset>

  <fieldset><legend>⭐ Pro Templates</legend>
    <div class="chips">
      <button class="chip" data-p="pro_banner">🏛 University Banner</button>
      <button class="chip" data-p="pro_paper">📄 Paper Accepted Pro</button>
      <button class="chip" data-p="pro_conf">⏳ Conference Deadlines Pro</button>
      <button class="chip" data-p="pro_seminar">🎤 Seminar Pro</button>
      <button class="chip" data-p="pro_hack">💻 Hackathon</button>
      <button class="chip" data-p="pro_fest">🎆 Tech Fest</button>
    </div>
  </fieldset>

  <fieldset><legend>📢 Admission &amp; Events</legend>
    <div class="chips">
      <button class="chip" data-p="adm_open">🎓 Admission Open</button>
      <button class="chip" data-p="fair_career">💼 Career / Job Fair</button>
      <button class="chip" data-p="fair_project">🔬 Project / Science Fair</button>
      <button class="chip" data-p="notice">📋 Notice / Deadline</button>
      <button class="chip" data-p="picnic">🎉 Picnic / Cultural Night</button>
    </div>
  </fieldset>

  <fieldset><legend>Design</legend>
    <div class="row">
      <div><label>Size</label>
        <select id="size"><option value="sq">Square 1080×1080</option><option value="pt">Portrait 1080×1350</option><option value="wd">Banner 1920×1080</option></select></div>
      <div><label>Theme</label>
        <select id="theme"><option value="navy">Navy &amp; Gold</option><option value="green">Emerald</option><option value="purple">Royal Purple</option><option value="red">Crimson</option><option value="sunset">Sunset</option><option value="light">Ivory (Light)</option><option value="campus">Campus Green</option><option value="forest">Forest &amp; Lime</option><option value="neon">Neon Matrix</option><option value="mint">Mint (Light Green)</option><option value="varsity">Varsity Maroon</option></select></div>
    </div>
    <div class="row">
      <div><label>Decoration</label>
        <select id="decor"><option value="confetti">Confetti</option><option value="bubbles">Bubbles</option><option value="tech">Tech Circuit</option><option value="binary">Binary Code</option><option value="rays">Sunburst</option><option value="diagonal">Diagonal Stripes</option><option value="waves">Waves</option><option value="geo">Pro Geometric</option><option value="hex">Hexagons</option><option value="rings">Concentric Rings</option><option value="tri">Low-poly Triangles</option><option value="none">Clean</option></select></div>
      <div><label>Photo shape</label>
        <select id="shape"><option value="circle">Circle</option><option value="square">Rounded square</option></select></div>
    </div>
  </fieldset>

  <fieldset><legend>Logo &amp; Frame</legend>
    <label>University / Dept logo (PNG/JPG)</label><input type="file" id="logo" accept="image/*">
    <div class="row">
      <div><label>Logo position</label><select id="logopos"><option value="tl">Top left</option><option value="tc">Top center</option><option value="tr">Top right</option><option value="bc">Bottom center</option></select></div>
      <div><label>Frame</label><select id="frame"><option value="double">Double line</option><option value="corners">Corner brackets</option><option value="none">None</option></select></div>
    </div>
  </fieldset>

  <fieldset><legend>People (photo + name)</legend>
    <div id="people"></div>
    <button id="add">＋ Add person</button>
  </fieldset>

  <fieldset><legend>Text</legend>
    <label>Top label (e.g. Congratulations, Seminar)</label><input type="text" id="label">
    <label>Main headline</label><input type="text" id="headline">
    <label>List rows (one per line: Name | Deadline | Info) — max 8</label><textarea id="list" style="min-height:110px"></textarea>
    <label>Title / topic (optional)</label><textarea id="title"></textarea>
    <label>Sub line (venue, conference, speaker type…)</label><input type="text" id="sub">
    <div class="row">
      <div><label>Date</label><input type="text" id="date"></div>
      <div><label>Time</label><input type="text" id="time"></div>
    </div>
    <label>Venue</label><input type="text" id="venue">
    <label>Extra line (supervisor, “All are welcome” …)</label><input type="text" id="extra">
    <label>Organization / Department</label><input type="text" id="org">
  </fieldset>
</section>

<section class="stage">
  <canvas id="c" width="1080" height="1080"></canvas>
  <button id="dl">⬇ Download PNG</button>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center;align-items:center">
    <select id="vstyle" style="width:auto"></select>
    <select id="vtext" style="width:auto"></select>
    <select id="vover" style="width:auto"><option value="both">Sparkles + Shine</option><option value="sparkle">Sparkles</option><option value="shine">Shine</option><option value="none">No overlay</option></select>
    <select id="vdur" style="width:auto"><option value="5">5 sec</option><option value="8" selected>8 sec</option><option value="12">12 sec</option></select>
    <button id="vprevbtn">👁 Preview</button>
    <button id="vdl">🎬 Download Video</button>
  </div>
</section>
</main>

<div id="vmodal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px">
  <canvas id="vprev" style="max-width:92vw;max-height:68vh;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.6)"></canvas>
  <div style="color:#fff;font:600 15px sans-serif" id="vname"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <button id="vpv">◀ Prev effect</button><button id="vnx">Next effect ▶</button><button id="tpv">◀ Text anim</button><button id="tnx">Text anim ▶</button><button id="vreplay">↻ Replay</button><button id="vsave">⬇ Download this</button><button id="vclose">✕ Close</button>
  </div>
</div>

 pro_seminar:{theme:'varsity',decor:'hex',size:'pt',frame:'double',logo:'tl',label:'Seminar',headline:'Seminar on Artificial Intelligence',title:'Topic: Write the seminar topic here',sub:'Guest Speaker',date:'25 November 2026',time:'10:00 AM',venue:'Seminar Room, CSE Building',extra:'All students and teachers are cordially invited',org:D,people:[['Dr. Speaker Name','Professor, University Name']]},

};
let people=[];
let logoImg=null;
const TXT=['label','headline','list','title','sub','date','time','venue','extra','org'];

function applyPreset(k){
  const p=PRESETS[k];
  TXT.forEach(i=>$(i).value=p[i]||'');
  ['theme','decor','size'].forEach(i=>$(i).value=p[i]);$('frame').value=p.frame||'double';$('logopos').value=p.logo||'tl';
  people=p.people.map(([name,role])=>({name,role,img:null}));
  renderPeople();draw();
}
function renderPeople(){
  const box=$('people');box.innerHTML='';
  people.forEach((p,i)=>{
    const d=document.createElement('div');d.className='person';
    d.innerHTML='<div class="ph"><b>Person '+(i+1)+'</b><button class="x">Remove</button></div><input type="text" placeholder="Name"><input type="text" placeholder="Role / Designation"><input type="file" accept="image/*">';
    const [n,r,f]=d.querySelectorAll('input');
    n.value=p.name;r.value=p.role;
    n.oninput=()=>{p.name=n.value;draw()};
    r.oninput=()=>{p.role=r.value;draw()};
    f.onchange=()=>{const file=f.files[0];if(!file){p.img=null;draw();return}
      const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{p.img=im;draw()};im.src=rd.result};rd.readAsDataURL(file)};
    d.querySelector('.x').onclick=()=>{people.splice(i,1);renderPeople();draw()};
    box.appendChild(d);
  });
  $('add').style.display=people.length>=4?'none':'block';
}
$('logo').onchange=e=>{const f=e.target.files[0];if(!f){logoImg=null;draw();return}
  const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{logoImg=im;draw()};im.src=rd.result};rd.readAsDataURL(f)};
$('add').onclick=()=>{if(people.length<4){people.push({name:'',role:'',img:null});renderPeople();draw()}};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>applyPreset(b.dataset.p));
[...TXT,'size','theme','decor','shape','frame','logopos'].forEach(i=>$(i).addEventListener('input',draw));

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

function shapePath(cx,cy,r){
  if($('shape').value==='circle'){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2)}
  else rr(cx-r,cy-r,2*r,2*r,r*.3);
}

function drawLogo(cx,cy,sz,T){
  const r=sz/2;ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=22;ctx.shadowOffsetY=6;
  ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.restore();
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r-5,0,7);ctx.clip();
  const k=Math.min((2*r-26)/logoImg.width,(2*r-26)/logoImg.height),w=logoImg.width*k,h=logoImg.height*k;
  ctx.drawImage(logoImg,cx-w/2,cy-h/2,w,h);ctx.restore();
  ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.strokeStyle=T.gold;ctx.lineWidth=5;ctx.stroke();
}
function drawPeople(bx,by,bw,bh,T,wide){
  const n=people.length,cols=wide?Math.min(n,2):n,rows=Math.ceil(n/cols),sw=bw/cols,sh=bh/rows;
  people.forEach((p,i)=>{
    const row=Math.floor(i/cols),col=i%cols,inRow=row===rows-1?n-row*cols:cols;
    const cx=bx+(cols-inRow)*sw/2+col*sw+sw/2;
    const r=Math.max(44,Math.min(sw/2-28,(sh-150)/2,wide?210:190));
    const top=by+row*sh+(sh-(2*r+132))/2,cy=top+r;
    ctx.save();ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=30;ctx.shadowOffsetY=10;
    shapePath(cx,cy,r+11);ctx.fillStyle=T.gold;ctx.fill();ctx.restore();
    ctx.save();shapePath(cx,cy,r+3);ctx.fillStyle=T.a;ctx.fill();ctx.restore();
    ctx.save();shapePath(cx,cy,r);ctx.clip();
    if(p.img){const s=Math.max(2*r/p.img.width,2*r/p.img.height),w=p.img.width*s,h=p.img.height*s;ctx.drawImage(p.img,cx-w/2,cy-h/2,w,h)}
    else{ctx.fillStyle=T.panel;ctx.fillRect(cx-r,cy-r,2*r,2*r);ctx.fillStyle=T.text;ctx.font=`700 ${r}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((p.name.trim()[0]||'?').toUpperCase(),cx,cy+r*.05);ctx.textBaseline='alphabetic'}
    ctx.restore();
    ctx.textAlign='center';ctx.fillStyle=T.text;
    let s=wide?36:38;ctx.font=`700 ${s}px ${FONT}`;
    while(ctx.measureText(p.name).width>sw-24&&s>20){s--;ctx.font=`700 ${s}px ${FONT}`}
    ctx.fillText(p.name,cx,top+2*r+70);
    if(p.role){let q=24;ctx.font=`500 ${q}px ${FONT}`;ctx.fillStyle=T.gold;
      while(ctx.measureText(p.role).width>sw-24&&q>16){q--;ctx.font=`500 ${q}px ${FONT}`}
      ctx.fillText(p.role,cx,top+2*r+110)}
  });
}

 wipelr:(v,b,W,H,t)=>{v.beginPath();v.rect(0,0,W*eo(t/1500),H);v.clip();v.drawImage(b,0,0)},

const VNAMES={zoom:'Cinematic Zoom In',zoomout:'Zoom Out Settle',kenburns:'Ken Burns Pan',pop:'Bounce Pop-in',pulse:'Heartbeat Pulse',sway:'Floating Sway',flip:'3D Flip',slide:'Slide Up',wipeup:'Wipe Up',wipelr:'Wipe Left to Right',iris:'Circle Iris',blinds:'Venetian Blinds',glitch:'Glitch Intro',spot:'Spotlight Reveal',pixel:'Pixel Resolve'};

const TFX={

function vlayers(){
  const grab=()=>{const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;c.getContext('2d').drawImage(cv,0,0);return c};
  LAY={m:'bg'};draw();const bg=grab(),ids=Object.keys(VM),layers=[];

let vp=null;
function openPrev(){const b=vlayers(),W=b.bg.width,H=b.bg.height,pc=$('vprev'),v=pc.getContext('2d');pc.width=W;pc.height=H;const ps=mkps(W,H);

function recordVideo(){
  if(!window.MediaRecorder){alert('Ei browser video recording support kore na. Chrome ba Edge use koro.');return}
  const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));

  const dur=+$('vdur').value*1000,st=$('vstyle').value,ov=$('vover').value,gold=THEMES[$('theme').value].gold,ps=mkps(W,H);
  const nm=(($('headline').value||'card').trim().replace(/[^\w\u0980-\u09FF]+/g,'-')||'card'),ext=mime.includes('mp4')?'.mp4':'.webm';

async function saveFile(blob,fname){
